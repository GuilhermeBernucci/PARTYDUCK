<title>Festa dos Patos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: tela cheia em 3D; HUD flutuante — placar à esquerda (faixa no topo no celular), painel de ação embaixo, janelas no centro. Tema único de fim de tarde, de propósito. */
:root {
  --ink: #fff7e8; --muted: #c9c1f0; --panel: rgba(28, 22, 70, .86); --panel-solid: #221b58; --line: #4a3f9c;

  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { background: #2a1f5c; color: var(--ink); font-family: var(--body); font-size: 15px; margin: 0; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }

.hud-top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px; pointer-events: none; z-index: 5;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); }
.brand { font-family: var(--display); font-size: clamp(20px, 4vw, 30px); color: var(--lantern); text-shadow: 0 3px 0 #0007, 0 0 18px #0005; white-space: nowrap; }
.chip { white-space: nowrap; background: var(--panel); border-radius: 999px; padding: 6px 12px; font-weight: 900; font-size: 13px; letter-spacing: .3px; }
.chip.warn { color: #ffd1d8; }
.spacer { flex: 1; }
.iconbtn { white-space: nowrap; pointer-events: auto; background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 999px; padding: 7px 13px; font-weight: 800; font-size: 13px; }

.players { position: fixed; left: max(14px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 62px); display: grid; gap: 6px; z-index: 5; width: 228px; }
.pl { background: var(--panel); border-radius: 14px; padding: 6px 10px 6px 6px; display: grid; grid-template-columns: auto 1fr auto; gap: 0 8px; align-items: center; border: 2px solid transparent; }
.pl.now { border-color: var(--lantern); }

.pl .st { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pl .st b { color: var(--lantern); }
.pl .rk { font-family: var(--display); font-size: 17px; color: var(--muted); grid-row: span 2; }
.it { display: inline-block; background: #ffffff1c; border-radius: 6px; padding: 0 5px; font-size: 10.5px; font-weight: 900; color: var(--ink); letter-spacing: .3px; }

.bottom { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 5;
  width: min(600px, calc(100% - 28px)); background: var(--panel); border-radius: 20px; padding: 12px 16px; display: grid; gap: 8px; backdrop-filter: blur(4px); }
.turn { font-family: var(--display); font-size: 21px; display: flex; align-items: center; gap: 8px; min-width: 0; }

.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8861c; }

  background: var(--panel); border-radius: 18px; padding: 10px 16px; display: grid; gap: 4px; text-align: center; }

  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(580px, 100%); background: var(--panel-solid); border: 2px solid var(--line); border-radius: 24px; padding: 22px; display: grid; gap: 14px; text-align: center; box-shadow: 0 24px 70px #000a; }

.names .face img { width: 100%; height: 100%; display: block; border-radius: 12px; }
.names .face span { position: absolute; right: -6px; bottom: -6px; background: var(--lantern); color: var(--lantern-ink); font-size: 10px; font-weight: 900; border-radius: 999px; padding: 1px 6px; }

.names .who small { color: var(--muted); font-weight: 800; font-size: 12px; }

.picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.picker button { background: #2c2470; border: 2px solid var(--line); border-radius: 16px; padding: 8px 6px; color: var(--ink); display: grid; gap: 2px; justify-items: center; position: relative; }

.rules { text-align: left; display: grid; gap: 6px; color: var(--muted); font-size: 14px; margin: 0; padding-left: 18px; }
.rules b { color: var(--ink); }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 3px; }
.shop { display: grid; gap: 8px; text-align: left; }

.explore span { color: var(--muted); font-size: 13.5px; } .explore b { color: var(--ink); }
.intro { position: fixed; inset: 0; z-index: 15; display: grid; grid-template-rows: auto 1fr auto auto; justify-items: center; text-align: center; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 28px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 36px) max(16px, env(safe-area-inset-left, 0px)); }

  if (!USE_OUTLINES) return;
  const list = []; root.traverse((o) => { if (o.isMesh && !o.userData.outline && !o.userData.noOutline) list.push(o); });
  list.forEach((m) => {
    if (!m.geometry.boundingSphere) m.geometry.computeBoundingSphere();

}

function textSprite(text, color = "#fff7e8", size = 1) {
  const meas = document.createElement("canvas").getContext("2d"); meas.font = '64px "Lilita One", sans-serif';
  const W = Math.max(256, Math.ceil(meas.measureText(text).width + 48));

  s.scale.set(size * W / 128, size, 1); s.renderOrder = 20; return s;
}

function sparkles(scene, pos, count = 10, color = "#ffd23f") {
  const parts = Array.from({ length: count }, (_, i) => {
    const m = new THREE.Mesh(starGeo, new THREE.MeshBasicMaterial({ color: i % 3 ? color : "#ffffff", transparent: true }));

function addEyes(g, y, z, sep = .11, r = .075, lashes = false) {

}

async function playTurn() {
  const p = cur(); cam.focus = p.mesh; cam.overview = false; $("camBtn").textContent = "Ver a ilha";
  renderHUD();
  if (p.skip) {
    p.skip = false; say(`${nameOf(p)} está tonto e perde a vez.`); bigText("Perdeu a vez!", 900);
    await tween(.6, (k) => { p.mesh.rotation.z = Math.sin(k * Math.PI * 6) * .2; }); p.mesh.rotation.z = 0; await settle(p.node); renderHUD(); await wait(.8); return;
  }
  let steps = null, rolls = 1, bonus = 0, usedItem = false;
  while (steps === null) {
    const usable = usedItem ? [] : [...new Set(p.items)].filter((k) => k !== "escudo" && canUse(p, k));
    let choice;
    if (p.bot) { await wait(.7); const bi = usedItem ? null : botItem(p); choice = bi || "roll"; }
    else {
      const blocked = usedItem ? [] : [...new Set(p.items)].filter((k) => ATTACKS.includes(k) && !canUse(p, k));
      say(usable.length ? `Role o dado ou use um item.${blocked.length ? ` (${blocked.map((k) => ITEMS[k].name).join(", ")}: ninguém no alcance.)` : ""}` : `Toque em <b>Rolar dado</b> ou aperte Espaço.`);
      choice = await ask([{ label: rolls > 1 ? `Rolar ${rolls} dados` : "Rolar dado", value: "roll" }, ...usable.map((k) => ({ label: "Usar " + ITEMS[k].name, value: k, ghost: true }))]);
    }
    if (choice === "roll") { steps = await rollDice(p, rolls); break; }
    const r = await useItem(p, choice);
    if (r.cancel) continue;
    usedItem = true;
    if (r.roll) rolls = r.roll;
    if (r.bonus) bonus += r.bonus;
    if (p.skip) { p.skip = false; }
  }
  if (bonus) { steps += bonus; setCount(steps); bigText(String(steps), 700); await wait(.5); }
  say(`${nameOf(p)} vai andar ${steps} casas.`);
  await moveSteps(p, steps);
  await land(p);
  await wait(.9);
}

  sim: () => rnd(0, 100),
  create(players) {

    const endP = mesh(new THREE.BoxGeometry(6, .5, 3.4), std("#4caf50"), true, true); endP.position.set(0, -.25, rowZ(ROWS - 1) - 2.6); scene.add(endP);

      placeCam(camera, new V3(5.5, 7.5, front + 7.5), new V3(0, 0, front - 2)); ents.forEach((e) => syncEnt(e, el));
    };
    inst.update = (dt) => {

// =====================================================================
//  Minigames simultâneos no teclado (até 4 ao mesmo tempo)
// =====================================================================
const KEYSETS = [
  { name: "W A S D + Espaço", up: "w", down: "s", left: "a", right: "d", act: " " },
  { name: "Setas + Enter", up: "arrowup", down: "arrowdown", left: "arrowleft", right: "arrowright", act: "enter" },
  { name: "I J K L + O", up: "i", down: "k", left: "j", right: "l", act: "o" },
  { name: "T F G H + Y", up: "t", down: "g", left: "f", right: "h", act: "y" },
];
const TEAM_COLORS = ["#ff8a3c", "#4cc9f0"];
function partyScene(players, sky, ground, groundR, info = {}) {
  const { scene, camera } = arena(sky, ground, groundR);
  let slot = 0;
  const ents = players.map((p, i) => {
    const m = makeAvatar(p.char); scene.add(m);
    const team = info.teams ? info.teams[i] : i;
    const ringColor = info.teams ? (info.solo !== undefined ? (i === info.solo ? "#ff5d72" : "#6fe39a") : TEAM_COLORS[team]) : p.color;
    const ring = new THREE.Mesh(new THREE.RingGeometry(.45, .62, 28), new THREE.MeshBasicMaterial({ color: ringColor, side: THREE.DoubleSide, transparent: true, opacity: .95 }));
    ring.rotation.x = -Math.PI / 2; scene.add(ring);
    const ctrl = p.bot ? null : KEYSETS[slot++];
    const tag = textSprite(p.name.slice(0, 10), ringColor, .5); scene.add(tag);
    return { p, i, m, ring, tag, ctrl, team, pos: new V3(), vel: new V3(), want: new V3(), alive: true, outAt: null, y: 0, vy: 0, cd: 0, duck: false, ai: {}, score: 0 };
  });
  return { scene, camera, ents };
}
function keyDir(e) {
  const k = e.ctrl; if (!k) return null;
  const v = new V3((keys.has(k.right) ? 1 : 0) - (keys.has(k.left) ? 1 : 0), 0, (keys.has(k.down) ? 1 : 0) - (keys.has(k.up) ? 1 : 0));
  if (v.lengthSq()) v.normalize(); return v;
}
function steer(e, dir, speed, dt, accel = 12) {
  e.vel.lerp(dir.clone().multiplyScalar(speed), 1 - Math.exp(-dt * accel));
  e.pos.addScaledVector(e.vel, dt);
  if (e.vel.lengthSq() > .1) e.m.rotation.y = Math.atan2(e.vel.x, e.vel.z);
}
function syncEnt(e, t) {
  e.m.position.set(e.pos.x, e.pos.y + e.y + (e.alive && e.vel.lengthSq() > .3 ? Math.abs(Math.sin(t * 14)) * .08 : 0), e.pos.z);
  e.ring.position.set(e.pos.x, e.pos.y + .03, e.pos.z); e.ring.visible = e.alive;
  e.tag.position.set(e.m.position.x, e.m.position.y + 1.75, e.m.position.z); e.tag.visible = e.alive;
}
function collide(ents, r = .5, push = 1) {
  for (let a = 0; a < ents.length; a++) for (let b = a + 1; b < ents.length; b++) {
    const A = ents[a], B = ents[b]; if (!A.alive || !B.alive) continue;
    const d = B.pos.clone().sub(A.pos).setY(0), L = d.length(); if (L > 2 * r || L < 1e-4) continue;
    const n = d.divideScalar(L), ov = 2 * r - L;
    A.pos.addScaledVector(n, -ov / 2); B.pos.addScaledVector(n, ov / 2);
    const rv = B.vel.clone().sub(A.vel).dot(n);
    if (rv < 0) { const j = -rv * push; A.vel.addScaledVector(n, -j); B.vel.addScaledVector(n, j); }
  }
}
function knockOut(e, t, style = "fall") {
  if (!e.alive) return; e.alive = false; e.outAt = t; sfx("quack"); emote(e.m, "hurt", 3);
  const m = e.m, from = m.position.clone();
  if (style === "squash") tween(.25, (k) => m.scale.set(1 + k * .5, 1 - k * .85, 1 + k * .5));
  else if (style === "boom") tween(1, (k) => { m.position.set(from.x + k * 2, from.y + Math.sin(Math.PI * k) * 4 - k * 2, from.z); m.rotation.z += .3; });
  else if (style === "freeze") { m.traverse((o) => { if (o.isMesh && !o.userData.outline && o.material.color) { o.material = o.material.clone(); o.material.color.lerp(new THREE.Color("#bfefff"), .6); } }); }
  else tween(.9, (k) => { m.position.y = from.y - k * k * 8; m.rotation.x += .1; });
}
function controlsLine(ents) { return ents.filter((e) => e.ctrl).map((e) => `${e.p.name}: ${e.ctrl.name}`).join(" · "); }
function ffaResult(ents, scoreFn, labelFn) { return { scores: ents.map(scoreFn), labels: ents.map(labelFn) }; }
function timeLabel(e, total) { return e.alive ? `sobreviveu ${total}s` : `caiu aos ${e.outAt.toFixed(1)}s`; }
function botAvoid(e, dangers, radius) { const away = new V3(); dangers.forEach((d) => { const v = e.pos.clone().sub(d).setY(0), L = v.length(); if (L < radius && L > 1e-3) away.addScaledVector(v.normalize(), (radius - L) / radius); }); return away; }

function boxCollide(e, boxes, r = .42) {
  boxes.forEach((b) => {
    if (e.y >= b.h - .25) return;
    const cx = Math.max(b.x - b.w / 2, Math.min(e.pos.x, b.x + b.w / 2)), cz = Math.max(b.z - b.d / 2, Math.min(e.pos.z, b.z + b.d / 2));
    const dx = e.pos.x - cx, dz = e.pos.z - cz, L = Math.hypot(dx, dz);
    if (L < r) { if (L > 1e-4) { e.pos.x = cx + dx / L * r; e.pos.z = cz + dz / L * r; } else { e.pos.x = b.x + (e.pos.x >= b.x ? 1 : -1) * (b.w / 2 + r); } }
  });
}
function addBoxes(scene, list, color) { list.forEach((b) => { const m = mesh(new THREE.BoxGeometry(b.w, b.h, b.d), std(b.c || color), true, true); m.position.set(b.x, b.h / 2, b.z); scene.add(m); }); }

      for (const p of G.players) {

      <li><b>Veja a cor da casa onde parou.</b> <span class="sw" style="background:#3fcf6e"></span>verde ganha 3 moedas, <span class="sw" style="background:#ff5268"></span>vermelha perde 3, <span class="sw" style="background:#a970ff"></span>roxa ativa uma atração do mapa e <span class="sw" style="background:#3f9bff"></span>azul é armadilha.</li>
      <li><b>Compre estrelas.</b> Passe pela estrela com ${STAR_COST} moedas para comprar. Ela muda de lugar depois. <b>Quem tiver mais estrelas no fim vence</b>; no empate, ganha quem tem mais moedas.</li>
      <li><b>Escolha caminhos.</b> Nas encruzilhadas, clique numa seta. Os atalhos são mais curtos, mas a ponte pode estar fechada e tem mais azar no caminho.</li>
      <li><b>Pegue itens e ataque.</b> Abra as caixas "?" do caminho ou compre nas lojas: luva de boxe, taser, sniper de tinta, granada, granada teleguiada, dose de energia, dados e escudo. Você leva até 3.</li>
      <li><b>Minigame no fim de cada rodada.</b> Uma roleta sorteia o formato: cada um por si, duplas ou 3 contra 1. Até 4 pessoas jogam juntas no teclado. Quem vai melhor ganha mais moedas.</li>
      <li><b>Cuidado com o vilão e procure o segredo.</b> O vilão do mapa anda sozinho e rouba moedas. Na metade do jogo vem uma surpresa, e todo mapa tem uma passagem escondida em alguma casa.</li>
    </ol>
    <div class="howmap"><b>Neste mapa: ${esc(m.name)}</b><span class="chips">${MAP_HIGHLIGHTS[setupState.map].map((h) => `<i>${h}</i>`).join("")}</span></div>
    <table class="keys"><tbody>${KEYSETS.map((k, i) => `<tr><td>Jogador ${i + 1}</td><td>${k.name}</td></tr>`).join("")}</tbody></table>
    <div class="row"><button class="btn" id="howBack">Entendi</button></div>`, true);
  s.querySelector("#howBack").addEventListener("click", back);
}

// =====================================================================
//  Tela de entrada: festa com patos pulando, se batendo e montando
// =====================================================================
let introScene = null;
function showIntro() {
  const { scene, camera } = arena("#ffcfa0", "#7ac35e", 12);
  scene.background = skyTex([[0, "#6a4fd8"], [.45, "#ff8fc0"], [.8, "#ffc27a"], [1, "#ffe3a8"]]);
  scene.fog = new THREE.Fog(0xffc27a, 30, 80);
  // bandeirinhas em volta
  const flagCols = ["#ff5d5d", "#ffc94d", "#4cc9f0", "#6fe39a", "#b98bff", "#ff8fc0"];
  const triGeo = new THREE.BufferGeometry(); triGeo.setAttribute("position", new THREE.Float32BufferAttribute([-.22, 0, 0, .22, 0, 0, 0, -.45, 0], 3)); triGeo.computeVertexNormals();
  const poles = Array.from({ length: 8 }, (_, i) => { const a = i / 8 * Math.PI * 2; const p = new V3(Math.cos(a) * 11, 3.6, Math.sin(a) * 11); const pole = mesh(new THREE.CylinderGeometry(.08, .1, 3.8, 6), std("#8a5a33")); pole.position.set(p.x, 1.9, p.z); scene.add(pole); return p; });
  poles.forEach((p1, i) => { const p2 = poles[(i + 1) % poles.length]; for (let k = 1; k < 12; k++) { const t = k / 12, p = p1.clone().lerp(p2, t); p.y -= Math.sin(Math.PI * t) * .9; const f = mesh(triGeo, new THREE.MeshStandardMaterial({ color: flagCols[(i + k) % 6], side: THREE.DoubleSide }), false); f.position.copy(p); f.lookAt(0, p.y, 0); scene.add(f); } });
  // balões
  const balloons = Array.from({ length: 14 }, (_, i) => { const g = new THREE.Group(); const b = mesh(new THREE.SphereGeometry(.5, 16, 12), std(flagCols[i % 6], { roughness: .3 }), false); b.scale.y = 1.15; g.add(b);
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new V3(0, -.6, 0), new V3(0, -2.2, 0)]), new THREE.LineBasicMaterial({ color: "#ffffff" })));
    const a = Math.random() * 6.28, r = rnd(9, 14); g.position.set(Math.cos(a) * r, rnd(4, 9), Math.sin(a) * r); g.userData.ph = Math.random() * 6; scene.add(g); return g; });
  // confete
  const N = 260, cpos = new Float32Array(N * 3), ccol = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { cpos.set([rnd(-12, 12), rnd(0, 14), rnd(-12, 12)], i * 3); const c = new THREE.Color(pick(flagCols)); ccol.set([c.r, c.g, c.b], i * 3); }
  const cg = new THREE.BufferGeometry(); cg.setAttribute("position", new THREE.BufferAttribute(cpos, 3)); cg.setAttribute("color", new THREE.BufferAttribute(ccol, 3));
  scene.add(new THREE.Points(cg, new THREE.PointsMaterial({ size: .18, vertexColors: true })));
  // palco com a estrela
  const stage = mesh(new THREE.CylinderGeometry(2.2, 2.4, .5, 32), std("#ffd23f"), true, true); stage.position.y = .25; scene.add(stage);
  const bigStar = starMesh(2.2); bigStar.position.set(0, 4.2, 0); scene.add(bigStar);
  // patos
  const ducks = [...CHARS, ...CHARS].map((ch, i) => {
    const m = makeAvatar(ch.id); scene.add(m);
    const bat = mesh(new THREE.CylinderGeometry(.05, .09, .9, 8), std("#d9a066")); bat.position.set(.35, .55, .1); bat.rotation.z = -.4; bat.visible = false; m.add(bat);
    const a = i / 16 * Math.PI * 2 + rnd(-.2, .2), r = rnd(3.5, 8.5);
    return { m, bat, pos: new V3(Math.cos(a) * r, 0, Math.sin(a) * r), vel: new V3(), y: 0, vy: 0, cool: rnd(.2, 2.5), stun: 0, swing: 0, chase: null, jumpTo: null, ride: null, rideT: 0, wander: new V3(rnd(-1, 1), 0, rnd(-1, 1)).normalize() };
  });
  const free = (d) => !d.ride && !ducks.some((o) => o.ride === d) && d.stun <= 0;
  let t = 0;
  const update = (dt) => {
    t += dt;
    placeCam(camera, new V3(Math.sin(t * .08) * 15, 7.5, Math.cos(t * .08) * 15), new V3(0, 1.4, 0));
    bigStar.rotation.y += dt; bigStar.position.y = 4.2 + Math.sin(t * 2) * .2;
    balloons.forEach((b) => { b.position.y += Math.sin(t + b.userData.ph) * .004; b.rotation.z = Math.sin(t * .8 + b.userData.ph) * .1; });
    for (let i = 0; i < N; i++) { let y = cpos[i * 3 + 1] - dt * 1.4; if (y < 0) y = 14; cpos[i * 3 + 1] = y; cpos[i * 3] += Math.sin(t * 2 + i) * dt * .3; }
    cg.attributes.position.needsUpdate = true;
    ducks.forEach((d) => {
      d.cool -= dt; d.stun -= dt; d.swing -= dt;
      d.bat.visible = !!d.chase || d.swing > 0;
      d.bat.rotation.x = d.swing > 0 ? -1.7 * Math.sin(d.swing / .3 * Math.PI) : 0;
      if (d.ride) {
        const h = d.ride; d.pos.copy(h.pos); d.y = h.y + 1.05 + Math.abs(Math.sin(t * 8)) * .15; d.rideT -= dt; d.m.rotation.y = h.m.rotation.y;
        if (d.rideT <= 0 || h.stun > 0) { d.ride = null; d.vy = 5.5; d.vel.set(rnd(-2, 2), 0, rnd(-2, 2)); d.cool = rnd(.6, 1.6); }
      } else {
        d.vy -= 18 * dt; d.y += d.vy * dt;
        if (d.y <= 0) { if (d.vy < -3) squash(d.m); d.y = 0; d.vy = 0; if (d.jumpTo) d.jumpTo = null; }
        const grounded = d.y === 0;
        let want = new V3();
        if (d.stun > 0) { d.m.rotation.y += dt * 14; }
        else if (d.jumpTo) {
          const tg = d.jumpTo; want = tg.pos.clone().sub(d.pos).setY(0); const L = want.length();
          d.pos.addScaledVector(want.normalize(), Math.min(L, 4.5 * dt));
          if (d.vy < 0 && L < .5 && d.y > tg.y + .8 && d.y < tg.y + 1.6 && free(tg)) { d.ride = tg; d.rideT = rnd(1.5, 3); d.jumpTo = null; popText(scene, tg.m.position.clone().add(new V3(0, 2.6, 0)), "Hehe!", "#ffe27a"); }
        } else if (d.chase) {
          const tg = d.chase; want = tg.pos.clone().sub(d.pos).setY(0); const L = want.length(); want.normalize();
          d.vel.lerp(want.clone().multiplyScalar(3.6), 1 - Math.exp(-dt * 6)); d.pos.addScaledVector(d.vel, dt);
          if (L < 1.15 && Math.abs(tg.y - d.y) < 1) { d.swing = .3; d.m.rotation.y = Math.atan2(want.x, want.z); emote(tg.m, "hurt", .9); emote(d.m, "happy", 1.2); tg.vy = 6.5; tg.stun = .9; tg.vel.copy(want).multiplyScalar(3); popText(scene, tg.m.position.clone().add(new V3(0, 1.8, 0)), "PÁ!", "#fff7e8"); d.chase = null; d.cool = rnd(1, 2.5); if (tg.ride) tg.ride = null; }
          else if (d.cool < -5) d.chase = null;
        } else {
          d.wander.applyAxisAngle(new V3(0, 1, 0), rnd(-1, 1) * dt * 2);
          if (d.pos.length() > 8.5) d.wander.copy(d.pos).multiplyScalar(-1).normalize();
          d.vel.lerp(d.wander.clone().multiplyScalar(1.4), 1 - Math.exp(-dt * 3)); d.pos.addScaledVector(d.vel, dt);
          if (d.cool <= 0 && grounded) {
            const r = Math.random(), others = ducks.filter((o) => o !== d && free(o) && o.pos.distanceTo(d.pos) < 5);
            if (r < .35 || !others.length) { d.vy = rnd(5, 7.5); d.cool = rnd(.8, 2); }
            else if (r < .68) { d.chase = pick(others); d.cool = 0; }
            else { const tg = others.sort((a, b) => a.pos.distanceTo(d.pos) - b.pos.distanceTo(d.pos))[0]; d.jumpTo = tg; d.vy = 8.2; d.cool = rnd(1, 2); }
          }
        }
        if (d.stun > 0) d.pos.addScaledVector(d.vel, dt);
        const r = Math.hypot(d.pos.x, d.pos.z); if (r < 2.7) d.pos.multiplyScalar(2.7 / r); if (r > 9.5) d.pos.multiplyScalar(9.5 / r);
        if (d.stun <= 0 && d.vel.lengthSq() > .2 && !d.jumpTo) d.m.rotation.y = Math.atan2(d.vel.x, d.vel.z);
      }
      d.m.position.set(d.pos.x, d.y + (d.ride ? 0 : d.y === 0 ? Math.abs(Math.sin(t * 9 + d.pos.x)) * .06 : 0), d.pos.z);
      d.m.rotation.z = d.stun > 0 ? Math.sin(t * 20) * .5 : 0;
    });
    // empurra patos que se encostam no chão
    for (let a = 0; a < ducks.length; a++) for (let b = a + 1; b < ducks.length; b++) { const A = ducks[a], B = ducks[b]; if (A.ride || B.ride || A.y > .3 || B.y > .3) continue; const d = B.pos.clone().sub(A.pos).setY(0), L = d.length(); if (L < .8 && L > 1e-3) { d.divideScalar(L).multiplyScalar((.8 - L) / 2); A.pos.sub(d); B.pos.add(d); } }
  };
  introScene = scene; setMusic("menu");
  active = { scene, camera, update };
  document.body.classList.add("in-intro");
  $("intro").hidden = false;
  $("playBtn").focus();
}
function applyQuality() {
  const low = SETTINGS.quality === "leve";
  renderer.setPixelRatio(low ? 1 : Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = !low;
  [boardScene, active && active.scene].forEach((sc) => sc && sc.traverse((o) => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => (m.needsUpdate = true)); }));
  resize();
}
const INVITE_TEXT = "Bora jogar Festa dos Patos comigo! É um jogo de festa em 3D com patos, estrelas, itens de ataque e mais de 45 minigames. Dá para jogar até 8 no mesmo computador.";
function showInvite() {
  const s = openSheet(`<div class="eyebrow">Convidar amigos</div><h2>Chame a galera para a festa</h2>
    <p>A Festa dos Patos é jogada <b>no mesmo computador</b>: até 4 pessoas jogam juntas no teclado e as outras vagas podem ser da CPU. Não tem partida online, então os amigos precisam estar com você.</p>
    <table class="keys"><tbody>${KEYSETS.map((k, i) => `<tr><td>Jogador ${i + 1}</td><td>${k.name}</td></tr>`).join("")}</tbody></table>
    <p>Para mandar o jogo para alguém, use o botão de <b>compartilhar</b> desta página e envie o link junto com a mensagem abaixo.</p>
    <div class="copybox" id="inviteText">${esc(INVITE_TEXT)}</div>
    <div class="row"><button class="btn" id="copyInvite">Copiar mensagem</button><button class="btn ghost" id="closeInvite">Voltar</button></div>`);
  s.querySelector("#copyInvite").addEventListener("click", (ev) => {
    const btn = ev.currentTarget;
    const done = () => { btn.textContent = "Mensagem copiada"; };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("inviteText")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = "Texto selecionado: copie com Ctrl+C"; };
    try { navigator.clipboard.writeText(INVITE_TEXT).then(done, fallback); } catch (e) { fallback(); }
  });
  s.querySelector("#closeInvite").addEventListener("click", closeSheet);
}
function showSettings() {
  const seg = (key, opts) => `<div class="ctl seg">${opts.map(([v, l]) => `<button data-k="${key}" data-v="${v}" aria-pressed="${String(SETTINGS[key]) === String(v)}">${l}</button>`).join("")}</div>`;
  const s = openSheet(`<div class="eyebrow">Configurações</div><h2>Do seu jeito</h2>
    <div class="opt"><b>Música</b><small>Uma música para cada mapa, para os minigames e para a festa do vencedor.</small>${seg("music", [[true, "Ligada"], [false, "Desligada"]])}</div>
    <div class="opt"><b>Som</b><small>Efeitos de quack, moedas, explosões e tudo mais.</small>${seg("sound", [[true, "Ligado"], [false, "Desligado"]])}</div>
    <div class="opt"><b><label for="vol">Volume</label></b><small>Arraste para ajustar.</small><div class="ctl"><input type="range" id="vol" min="0" max="1" step="0.05" value="${SETTINGS.volume}"></div></div>
    <div class="opt"><b>Velocidade do tabuleiro</b><small>Deixa os pulos, dados e animações do tabuleiro mais rápidos. Não muda os minigames.</small>${seg("speed", [[1, "Normal"], [1.6, "Rápida"], [2.4, "Turbo"]])}</div>
    <div class="opt"><b>Gráficos</b><small>"Leve" tira as sombras e baixa a resolução. Use se o jogo ficar travando.</small>${seg("quality", [["alta", "Bonito"], ["leve", "Leve"]])}</div>
    <div class="opt" style="border:0"><b>Controles</b><small>Até 4 jogadores no teclado. Na Bolsa de Ouro, o jogador 1 também pula com Espaço e bate com o mouse.</small></div>
    <table class="keys"><tbody>${KEYSETS.map((k, i) => `<tr><td>Jogador ${i + 1}</td><td>${k.name}</td></tr>`).join("")}</tbody></table>
    <div class="row"><button class="btn" id="closeSettings">Pronto</button></div>`);
  s.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.k, raw = b.dataset.v, v = raw === "true" ? true : raw === "false" ? false : isNaN(+raw) ? raw : +raw;
    SETTINGS[k] = v; saveSettings();
    if (k === "sound") { muted = !v; syncSound(); if (v) sfx("quack"); }
    if (k === "music") setMusic(MUSIC.track || "menu");
    if (k === "quality") applyQuality();
    s.querySelectorAll(`[data-k="${k}"]`).forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
  }));
  s.querySelector("#vol").addEventListener("input", (e) => { SETTINGS.volume = +e.target.value; saveSettings(); });
  s.querySelector("#vol").addEventListener("change", () => sfx("coin"));
  s.querySelector("#closeSettings").addEventListener("click", closeSheet);
}
